# Perfil "h2": base en memoria, sin Docker y sin persistencia.
#
# Se borra entera en cada arranque, asi que sirve para probar contra datos limpios
# o para trabajar sin tener el contenedor levantado. Si lo que queres es que los
# datos duren, NO uses este perfil: el por defecto ya apunta a PostgreSQL.
#
# Activar con: mvnw spring-boot:run -Dspring-boot.run.profiles=h2

spring.datasource.url=jdbc:h2:mem:mediconecta;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Perfil "h2": base en memoria, sin Docker y sin persistencia.
#
# Se borra entera en cada arranque, asi que sirve para probar contra datos limpios
# o para trabajar sin tener el contenedor levantado. Si lo que queres es que los
# datos duren, NO uses este perfil: el por defecto ya apunta a PostgreSQL.
#
# Activar con: mvnw spring-boot:run -Dspring-boot.run.profiles=h2

spring.datasource.url=jdbc:h2:mem:mediconecta;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- ActiveMQ (JMS) ---
# Este perfil es para correr sin Docker (tests, desarrollo rapido), y no siempre
# hay un broker levantado. Se apaga el auto-arranque de los @JmsListener para que
# el contexto no intente conectarse: los tests de cada modulo de mensajeria mockean
# JmsTemplate en vez de depender de un broker real.
spring.jms.listener.auto-startup=false
# Sin esto, /actuator/health intenta abrir una conexion JMS real para el healthcheck
# y devuelve 503 cuando no hay broker (que es la situacion normal en este perfil).
management.health.jms.enabled=false

# Levanta todo el sistema con: docker compose up --build
#
# Son tres contenedores:
#   postgres -> la base de datos
#   activemq -> el broker JMS (colas de tickets/chat, topico de eventos de viaje)
#   backend  -> la aplicacion Spring Boot
#
# Se comunican por la red interna "mediconecta-network". Dentro de esa red
# cada servicio es alcanzable por su nombre, por eso la URL de la base
# apunta a "postgres" y no a "localhost" (lo mismo para "activemq").

services:

  postgres:
    image: postgres:17-alpine
    container_name: mediconecta-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mediconecta_db}
      POSTGRES_USER: ${POSTGRES_USER:-mediconecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediconecta}
    ports:
      # Se expone al host para poder conectarse con DBeaver / pgAdmin desde afuera.
      - "5432:5432"
    volumes:
      # Sin este volumen los datos se perderian al borrar el contenedor.
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mediconecta-network
    healthcheck:
      # Marca el servicio como "healthy" recien cuando Postgres acepta conexiones.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediconecta} -d ${POSTGRES_DB:-mediconecta_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    # Interfaz web para mirar y consultar la base sin instalar nada en la maquina.
    # Queda en http://localhost:5050
    image: dpage/pgadmin4:latest
    container_name: mediconecta-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mediconecta.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      # Modo escritorio: entra directo, sin pantalla de login.
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      # Deja la conexion al servidor ya cargada al abrir pgAdmin.
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      # Conserva las preferencias y consultas guardadas entre reinicios.
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - mediconecta-network
    depends_on:
      postgres:
        condition: service_healthy

  activemq:
    # Broker JMS: procesa la cola de tickets, la de chat P2P y el topico de eventos
    # de viaje. Consola web de administracion en http://localhost:8161 (admin/admin).
    image: apache/activemq-classic:6.1.6
    container_name: mediconecta-activemq
    environment:
      ACTIVEMQ_ADMIN_LOGIN: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_ADMIN_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
    ports:
      # OpenWire: es el que usa la app para mandar/recibir mensajes JMS.
      - "61616:61616"
      # Consola web de colas/topicos.
      - "8161:8161"
    networks:
      - mediconecta-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u ${ACTIVEMQ_USER:-admin}:${ACTIVEMQ_PASSWORD:-admin} http://localhost:8161/admin/xml/queues.jsp || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: .
    container_name: mediconecta-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mediconecta_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-mediconecta}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-mediconecta}
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-mediconecta-clave-secreta-de-desarrollo-cambiar-en-produccion-1234567890}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mediconecta.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        # No arranca hasta que la base este realmente lista, no solo iniciada.
        condition: service_healthy
      activemq:
        condition: service_healthy
    networks:
      - mediconecta-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  pgadmin_data:

networks:
  mediconecta-network:
    driver: bridge

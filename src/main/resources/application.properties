spring.application.name=mediconecta

# Perfil por defecto: desarrollo local con H2 en memoria.
# En Docker se sobreescribe con SPRING_PROFILES_ACTIVE=docker (ver application-docker.properties).

# --- Servidor (Tomcat embebido) ---
server.port=8080

# --- Base de datos en memoria (H2) ---
spring.datasource.url=jdbc:h2:mem:mediconecta;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- Seguridad / JWT ---
# Clave secreta para firmar los tokens (HS512 necesita al menos 64 caracteres).
# En produccion NUNCA va hardcodeada: se lee de una variable de entorno.
app.jwt.secret=${JWT_SECRET:mediconecta-clave-secreta-de-desarrollo-cambiar-en-produccion-1234567890}
# Access token: 1 hora
app.jwt.access-expiration-ms=3600000
# Refresh token: 7 dias
app.jwt.refresh-expiration-ms=604800000

# --- Usuario ADMIN que se crea al arrancar (solo para desarrollo) ---
app.admin-inicial.email=${ADMIN_EMAIL:admin@mediconecta.com}
app.admin-inicial.password=${ADMIN_PASSWORD:admin1234}

# --- CORS: origenes del frontend permitidos ---
# Vite corre en 5173 pero si el puerto esta ocupado prueba el siguiente (5174, 5175, ...),
# asi que en desarrollo se habilitan varios de una. En produccion se pisa por variable de entorno.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175}

# --- Actuator (health, info, metrics) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

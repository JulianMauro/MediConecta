# Perfil "prod": la app corre en un hosting real (Render, Fly.io, Railway...).
# Se activa con SPRING_PROFILES_ACTIVE=prod.
#
# A diferencia de los otros perfiles, aca NO hay defaults de cortesia: si falta
# una variable de entorno la app no arranca (ver ValidacionSecretosConfig).
# Eso es a proposito — es preferible un deploy que falla a uno que queda abierto.
#
# Variables obligatorias en el hosting:
#   DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD
#   JWT_SECRET             -> generar con: openssl rand -base64 64
#   ADMIN_PASSWORD         -> distinta de admin1234
#   CORS_ALLOWED_ORIGINS   -> https://<tu-sitio>.netlify.app (sin localhost)

# --- Base de datos ---
# Sin default a proposito: si el hosting no define DATABASE_URL, la app no arranca
# en lugar de intentar conectarse al localhost del contenedor, que no existe.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# --- JPA / Hibernate ---
# Sigue en "update" porque el proyecto todavia no tiene migraciones versionadas:
# con "validate" el primer deploy fallaria, ya que la base arranca vacia.
# Es una deuda conocida — lo correcto es Flyway y pasar esto a "validate", asi un
# cambio de entidad no altera solo el esquema con datos reales adentro.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- H2 apagado ---
spring.h2.console.enabled=false

# --- Errores: no filtrar internals al cliente ---
# Sin esto, una excepcion no manejada puede devolver el stacktrace y el mensaje
# original, que suelen decir mas de la cuenta sobre el esquema y las rutas.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# --- Detras del proxy del hosting ---
# Render/Fly/Railway terminan TLS en su balanceador y reenvian por HTTP. Sin esto
# la app se cree en HTTP y arma mal las URLs absolutas y las cookies seguras.
server.forward-headers-strategy=native

# --- Logs ---
logging.level.root=INFO
logging.level.com.mediconecta=INFO
logging.level.org.springframework.security=WARN

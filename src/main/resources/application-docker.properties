# Perfil "docker": la app corre en un contenedor y usa PostgreSQL.
# Se activa con SPRING_PROFILES_ACTIVE=docker (lo setea docker-compose.yml).
#
# Todo lo sensible viene por variable de entorno. Los valores despues de ":"
# son solo el default de desarrollo.

# --- Base de datos PostgreSQL ---
# "postgres" es el nombre del servicio en docker-compose: Docker lo resuelve como host.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgres:5432/mediconecta_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:mediconecta}
spring.datasource.password=${DATABASE_PASSWORD:mediconecta}

# --- Pool de conexiones (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# --- JPA / Hibernate ---
# "update" crea y modifica las tablas solo. Para produccion de verdad conviene
# "validate" mas migraciones versionadas (Flyway o Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# En un contenedor no queremos el ruido de cada query en los logs.
spring.jpa.show-sql=false

# --- H2 apagado: aca la base es PostgreSQL ---
spring.h2.console.enabled=false

spring.application.name=mediconecta

# Perfil por defecto: la app corre en la maquina (IDE o mvnw) contra el PostgreSQL
# que levanta docker compose. Los datos sobreviven a reiniciar el backend.
#
# Los otros dos perfiles:
#   docker -> la app tambien corre en un contenedor (ver application-docker.properties)
#   h2     -> base en memoria, se borra en cada arranque (ver application-h2.properties)
#             Se activa con: mvnw spring-boot:run -Dspring-boot.run.profiles=h2

# --- Servidor (Tomcat embebido) ---
server.port=8080

# --- Base de datos PostgreSQL (contenedor "mediconecta-postgres") ---
# Aca el host es localhost y no "postgres": ese nombre solo lo resuelve Docker
# dentro de su red interna, y esta app corre fuera. El puerto 5432 llega al
# contenedor porque docker-compose.yml lo publica al host.
# Levantar la base sola: docker compose up -d postgres
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mediconecta_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:mediconecta}
spring.datasource.password=${DATABASE_PASSWORD:mediconecta}

# La consola H2 solo tiene sentido con el perfil h2.
spring.h2.console.enabled=false

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- Seguridad / JWT ---
# Clave secreta para firmar los tokens (HS512 necesita al menos 64 caracteres).
# En produccion NUNCA va hardcodeada: se lee de una variable de entorno.
app.jwt.secret=${JWT_SECRET:mediconecta-clave-secreta-de-desarrollo-cambiar-en-produccion-1234567890}
# Access token: 15 minutos.
# Corto a proposito: no hay lista de tokens revocados, asi que "cerrar sesion" solo
# borra el token del cliente. Este TTL es lo que acota cuanto vive un token robado.
app.jwt.access-expiration-ms=900000
# Refresh token: 7 dias
app.jwt.refresh-expiration-ms=604800000

# --- Usuario ADMIN que se crea al arrancar (solo para desarrollo) ---
app.admin-inicial.email=${ADMIN_EMAIL:admin@mediconecta.com}
app.admin-inicial.password=${ADMIN_PASSWORD:admin1234}

# --- Google Maps: Geocoding (direccion -> lat/lng) ---
# Es la key de BACKEND: restringida solo a Geocoding API, sin restriccion de dominio.
# Nunca es la misma que la del front (VITE_GOOGLE_MAPS_API_KEY), que va restringida
# por dominio y solo a Maps JavaScript API.
# El default vacio es a proposito: sin key el sistema funciona igual, las estaciones
# se guardan sin coordenadas y se completan despues con POST /api/estaciones/{id}/geocodificar.
app.google-maps.api-key=${GOOGLE_MAPS_API_KEY:}

# --- CORS: origenes del frontend permitidos ---
# Vite corre en 5173 pero si el puerto esta ocupado prueba el siguiente (5174, 5175, ...),
# asi que en desarrollo se habilitan varios de una. En produccion se pisa por variable de entorno.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175}

# --- Actuator (health, info, metrics) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
